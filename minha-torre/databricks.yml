bundle:
  name: minha-torre

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID

resources:
  apps:
    app:
      name: "minha-torre"
      description: "Projeto Farol da Vértice: projetos em risco e simulador de realocação"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # Uncomment to enable on behalf of user API scopes. Available scopes: sql, genie, files, model-serving
      # user_api_scopes:
      #   - sql

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE

targets:
  default:
    default: true
    workspace:
      host: https://dbc-905b97dc-9617.cloud.databricks.com

    variables:
      sql_warehouse_id: 8cb12bbdb6c6f326
